# ─────────────────────────────────────────────────────────────────
# Nginx Configuration — CodeCollab Reverse Proxy
#
# Responsibilities:
#   1. Serve the React frontend (static files from frontend container)
#   2. Proxy /api/* requests to the backend
#   3. Proxy /auth/* requests to the backend
#   4. Upgrade /socket.io/* connections to WebSocket
#   5. SSL termination in production (see HTTPS section below)
# ─────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Gzip compression for faster page loads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── Upstream servers ──────────────────────────────────────
    upstream backend {
        server backend:4000;
        # Add more backend instances here for horizontal scaling:
        # server backend2:4000;
        # server backend3:4000;
    }

    upstream frontend {
        server frontend:80;
    }

    # ── HTTP Server ───────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # In production, redirect all HTTP to HTTPS:
        # return 301 https://$host$request_uri;

        # ── API routes → backend ──────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Auth routes → backend ─────────────────────────────
        location /auth/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Socket.IO → backend (WebSocket upgrade) ───────────
        # This is critical — without the Upgrade headers, WebSocket
        # connections will fail and fall back to HTTP long-polling.
        location /socket.io/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;

            # These two headers trigger the WebSocket protocol upgrade
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;

            # Keep WebSocket connections alive for longer
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ── Everything else → frontend (React SPA) ────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;

            # Required for React Router — unknown paths return index.html
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        location @fallback {
            proxy_pass http://frontend;
        }
    }

    # ── HTTPS Server (uncomment in production) ────────────────
    # To enable HTTPS:
    # 1. Obtain SSL certificates (Let's Encrypt: certbot certonly)
    # 2. Copy cert files to nginx/ssl/
    # 3. Uncomment this block and update the domain name
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # (same location blocks as HTTP server above)
    # }
}
