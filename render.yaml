services:
  # ── Backend Web Service ────────────────────────────────────
  - type: web
    name: codecollab-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: codecollab-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://codecollab-app.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://codecollab-app.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
      - key: JUDGE0_API_URL
        value: https://ce.judge0.com

  # ── Frontend Static Site ───────────────────────────────────
  - type: web
    name: codecollab-app
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://codecollab-api.onrender.com
      - key: VITE_SOCKET_URL
        value: https://codecollab-api.onrender.com
      - key: VITE_PUBLIC_URL
        value: https://codecollab-app.onrender.com

# ── Managed PostgreSQL Database ─────────────────────────────
databases:
  - name: codecollab-db
    plan: free
    databaseName: collab_editor
    user: postgres
