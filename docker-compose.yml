version: '3.9'

# ─────────────────────────────────────────────────────────────────
# CodeCollab — Docker Compose (Development + Production)
#
# Services:
#   postgres  — PostgreSQL database
#   redis     — Redis (Socket.IO pub/sub + session cache)
#   backend   — Node.js/Express API + Socket.IO server
#   frontend  — React/Vite app (served by Nginx in prod)
#   nginx     — Reverse proxy (routes frontend + API + WebSocket)
#
# Usage:
#   Development:  docker compose up
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# ─────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: collab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-collab_editor}
    ports:
      - "5432:5432"          # expose to host for local Prisma Studio / migrations
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-collab_editor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - collab_net

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: collab_redis
    restart: unless-stopped
    command: redis-server --appendonly yes  # persist data to disk
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - collab_net

  # ── Backend (Node.js + Express + Socket.IO) ─────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collab_backend
    restart: unless-stopped
    env_file:
      - .env                 # reads your .env file at project root
    environment:
      # Override DATABASE_URL and REDIS_URL to use Docker service names
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-collab_editor}
      REDIS_URL:    redis://redis:6379
      NODE_ENV:     ${NODE_ENV:-development}
      PORT:         4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount source for live reload in development (remove in prod)
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - collab_net

  # ── Frontend (React + Vite dev server / Nginx in prod) ───────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: collab_frontend
    restart: unless-stopped
    ports:
      - "5173:80"            # Nginx inside the container serves on port 80
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - collab_net

  # ── Nginx (Reverse Proxy) ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: collab_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro   # mount SSL certs in production
    depends_on:
      - frontend
      - backend
    networks:
      - collab_net

# ── Volumes (persistent data) ────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ── Network (isolated Docker network) ────────────────────────
networks:
  collab_net:
    driver: bridge
